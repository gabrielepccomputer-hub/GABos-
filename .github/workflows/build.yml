name: Build GAB OS Galactic Edition
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
      options: --privileged
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4
      - name: Installazione Strumenti
        run: |
          apt-get update
          apt-get install -y live-build debootstrap syslinux-utils xorriso wget ca-certificates
      - name: Configurazione e Build
        run: |
          lb clean --all
          mkdir -p config/package-lists
          lb config             --mode debian             --system live             --architectures amd64             --distribution bookworm             --archive-areas "main"             --mirror-bootstrap "http://deb.debian.org/debian/"             --binary-images iso-hybrid
          echo "nano sudo network-manager" > config/package-lists/gab.list.chroot
          lb build
      - name: Caricamento ISO
        uses: actions/upload-artifact@v4
        with:
          name: GAB-OS-Galactic-ISO
          path: "*.iso"
