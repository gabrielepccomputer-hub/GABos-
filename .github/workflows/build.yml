name: Build GAB OS Galactic Edition

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Pulizia e Setup
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap xorriso

      - name: Configurazione Forzata
        run: |
          sudo lb clean --all
          mkdir -p config/package-lists
          
          # Configurazione iper-semplice per evitare conflitti
          lb config \
            --mode debian \
            --system live \
            --distribution bookworm \
            --archive-areas "main" \
            --binary-images iso-hybrid \
            --memtest none

          # Solo UN pacchetto (konsole) per testare se il tunnel funziona
          echo "konsole sudo network-manager sddm plasma-desktop" > config/package-lists/gab.list.chroot

      - name: Compilazione ISO (Manovra di Emergenza)
        run: |
          # A volte serve creare manualmente questa cartella per evitare l'errore 100
          sudo mkdir -p chroot/var/lib/apt/lists/partial
          sudo lb build

      - name: Caricamento ISO
        uses: actions/upload-artifact@v4
        with:
          name: GAB-OS-Galactic-ISO
          path: "*.iso"
