name: Build GAB OS Galactic Edition

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Installazione Dipendenze
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap isolinux squashfs-tools xorriso debian-archive-keyring wget

      - name: Configurazione Totale
        run: |
          sudo lb clean --all
          # Creiamo una struttura pulita da zero
          mkdir -p config/package-lists config/hooks/live
          
          lb config \
            --mode debian \
            --system live \
            --architectures amd64 \
            --distribution bookworm \
            --archive-areas "main contrib non-free non-free-firmware" \
            --mirror-bootstrap "http://deb.debian.org/debian/" \
            --mirror-binary "http://deb.debian.org/debian/" \
            --binary-images iso-hybrid \
            --memtest none

          # Lista pacchetti base + quelli che volevi (Bluetooth, Rete, KDE)
          echo "kde-plasma-desktop sddm dolphin konsole sudo wget network-manager bluez bluetooth firmware-linux-nonfree" > config/package-lists/gab.list.chroot

      - name: Compilazione ISO (Log Dettagliato)
        run: |
          # Usiamo "|| true" per non far fallire subito se c'è un avviso, ma logghiamo tutto
          sudo lb build

      - name: Caricamento ISO
        uses: actions/upload-artifact@v4
        with:
          name: GAB-OS-Galactic-ISO
          path: "*.iso"
