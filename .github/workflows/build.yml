name: Build GAB OS Galactic Edition

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Installazione strumenti Live Build
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap isolinux squashfs-tools xorriso

      - name: Configurazione e Compilazione ISO
        run: |
          sudo lb clean --all
          lb config \
            --mode debian \
            --system live \
            --architectures amd64 \
            --distribution bookworm \
            --archive-areas "main contrib non-free non-free-firmware" \
            --mirror-bootstrap "http://deb.debian.org/debian/" \
            --mirror-binary "http://deb.debian.org/debian/" \
            --binary-images iso-hybrid
          
          sudo lb build

      - name: Caricamento ISO
        uses: actions/upload-artifact@v4
        with:
          name: GAB-OS-Galactic-ISO
          path: "*.iso"
