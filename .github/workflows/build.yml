name: Build GAB OS Galactic Edition

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Reset Certificati e Strumenti
        run: |
          sudo apt-get update
          sudo apt-get install -y --reinstall ca-certificates
          sudo apt-get install -y live-build debootstrap isolinux squashfs-tools xorriso debian-archive-keyring

      - name: Configurazione con Mirror Alternativo
        run: |
          sudo lb clean --all
          mkdir -p config/package-lists
          
          # Usiamo il mirror globale deb.debian.org ma forziamo l'uso di HTTP per evitare errori SSL
          lb config \
            --mode debian \
            --system live \
            --architectures amd64 \
            --distribution bookworm \
            --archive-areas "main contrib non-free non-free-firmware" \
            --mirror-bootstrap "http://ftp.debian.org/debian/" \
            --mirror-binary "http://ftp.debian.org/debian/" \
            --binary-images iso-hybrid \
            --memtest none \
            --apt-recommends false

          # Lista super ridotta: solo l'indispensabile per vedere il verde
          echo "kde-plasma-desktop sddm dolphin konsole sudo network-manager" > config/package-lists/gab.list.chroot

      - name: Compilazione ISO
        run: |
          # Aggiungiamo un flag di debug per vedere esattamente DOVE fallisce
          sudo lb build --verbose

      - name: Caricamento ISO
        uses: actions/upload-artifact@v4
        with:
          name: GAB-OS-Galactic-ISO
          path: "*.iso"
