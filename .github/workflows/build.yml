name: Build GAB OS Galactic Edition

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Installazione strumenti
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap isolinux squashfs-tools xorriso

      - name: Configurazione Pulita
        run: |
          sudo lb clean --all
          rm -rf config/
          lb config \
            --mode debian \
            --system live \
            --architectures amd64 \
            --distribution bookworm \
            --archive-areas "main" \
            --mirror-bootstrap "http://deb.debian.org/debian/" \
            --mirror-binary "http://deb.debian.org/debian/" \
            --binary-images iso-hybrid

      - name: Lista Pacchetti Base (No Crash Edition)
        run: |
          mkdir -p config/package-lists
          # Solo l'essenziale per vedere se la ISO viene creata
          echo "kde-plasma-desktop sddm dolphin konsole sudo wget" > config/package-lists/gab.list.chroot

      - name: Compilazione ISO
        run: |
          sudo lb build

      - name: Caricamento ISO
        uses: actions/upload-artifact@v4
        with:
          name: GAB-OS-Galactic-ISO
          path: "*.iso"
