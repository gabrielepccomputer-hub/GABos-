name: Build GAB OS Galactic Edition

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Installazione Dipendenze
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap isolinux squashfs-tools xorriso debian-archive-keyring wget

      - name: Configurazione Live Build
        run: |
          sudo lb clean --all
          mkdir -p config/package-lists
          
          # Configurazione con i nuovi nomi delle aree Debian Bookworm
          lb config \
            --mode debian \
            --system live \
            --architectures amd64 \
            --distribution bookworm \
            --archive-areas "main contrib non-free non-free-firmware" \
            --mirror-bootstrap "http://deb.debian.org/debian/" \
            --mirror-binary "http://deb.debian.org/debian/" \
            --binary-images iso-hybrid \
            --memtest none

          # Lista pacchetti MINIMA (Solo l'essenziale per il boot e KDE)
          echo "kde-plasma-desktop sddm dolphin konsole sudo network-manager" > config/package-lists/gab.list.chroot

      - name: Compilazione ISO
        run: |
          sudo lb build

      - name: Caricamento ISO
        uses: actions/upload-artifact@v4
        with:
          name: GAB-OS-Galactic-ISO
          path: "*.iso"
