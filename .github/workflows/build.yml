name: Build GAB OS Galactic Edition

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Installazione strumenti Live Build
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap isolinux squashfs-tools xorriso

      - name: Pulizia Profonda e Configurazione
        run: |
          # Forza la rimozione di vecchi file di configurazione
          sudo lb clean --all
          rm -rf config/
          
          # Rigenera la configurazione base
          lb config \
            --mode debian \
            --system live \
            --architectures amd64 \
            --distribution bookworm \
            --archive-areas "main contrib non-free non-free-firmware" \
            --mirror-bootstrap "http://deb.debian.org/debian/" \
            --mirror-binary "http://deb.debian.org/debian/" \
            --binary-images iso-hybrid

      - name: Creazione Lista Pacchetti Pulita
        run: |
          mkdir -p config/package-lists
          echo "kde-standard sddm plasma-nm plasma-pa dolphin konsole kate ark gwenview spectacle sudo firmware-linux firmware-linux-nonfree firmware-realtek firmware-iwlwifi gparted wget ca-certificates gnupg libu2f-udev libvulkan1 mesa-vulkan-drivers vulkan-tools" > config/package-lists/gab.list.chroot

      - name: Iniezione Hook Chrome
        run: |
          mkdir -p config/hooks/live
          cat <<'CHROME' > config/hooks/live/0100-install-chrome.chroot
          #!/bin/sh
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -O /tmp/chrome.deb
          apt-get update
          apt-get install -y /tmp/chrome.deb
          rm /tmp/chrome.deb
          CHROME
          chmod +x config/hooks/live/0100-install-chrome.chroot

      - name: Compilazione ISO
        run: |
          sudo lb build

      - name: Caricamento ISO
        uses: actions/upload-artifact@v4
        with:
          name: GAB-OS-Galactic-ISO
          path: "*.iso"
