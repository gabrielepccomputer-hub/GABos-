name: Build GAB OS Galactic Edition

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Preparazione Ambiente
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap isolinux squashfs-tools xorriso debian-archive-keyring

      - name: Configurazione Forzata Debian
        run: |
          sudo lb clean --all
          rm -rf config/
          # lb config con parametri di compatibilità estrema
          lb config \
            --mode debian \
            --system live \
            --architectures amd64 \
            --distribution bookworm \
            --archive-areas "main" \
            --mirror-bootstrap "http://deb.debian.org/debian/" \
            --mirror-binary "http://deb.debian.org/debian/" \
            --debootstrap-options "--include=debian-archive-keyring" \
            --binary-images iso-hybrid

      - name: Lista Pacchetti Essenziali
        run: |
          mkdir -p config/package-lists
          echo "kde-plasma-desktop sddm dolphin konsole sudo wget" > config/package-lists/gab.list.chroot

      - name: Compilazione ISO
        run: |
          # Usiamo un trucco per far credere al sistema di essere una vera Debian
          sudo lb build

      - name: Caricamento ISO
        uses: actions/upload-artifact@v4
        with:
          name: GAB-OS-Galactic-ISO
          path: "*.iso"
